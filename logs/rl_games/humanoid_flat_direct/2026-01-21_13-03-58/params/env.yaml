    gpu_max_soft_body_contacts: 1048576
    gpu_max_particle_contacts: 1048576
  physics_material:
    func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
    static_friction: 0.5
    dynamic_friction: 0.5
    restitution: 0.0
    improve_patch_friction: true
    friction_combine_mode: average
    restitution_combine_mode: average
    compliant_contact_stiffness: 0.0
    compliant_contact_damping: 0.0
  render:
    enable_translucency: null
    enable_reflections: null
    enable_global_illumination: null
    antialiasing_mode: null
    enable_dlssg: null
    enable_dl_denoiser: null
    dlss_mode: null
    enable_direct_lighting: null
    samples_per_pixel: null
    enable_shadows: null
    enable_ambient_occlusion: null
    carb_settings: null
    rendering_mode: null
ui_window_class_type: isaaclab.envs.ui.base_env_window:BaseEnvWindow
seed: 42
decimation: 2
is_finite_horizon: false
episode_length_s: 15.0
scene:
  num_envs: 8192
  env_spacing: 4.0
  lazy_sensor_update: true
  replicate_physics: true
  filter_collisions: true
events:
  physics_material:
    func: isaaclab.envs.mdp.events:randomize_rigid_body_material
    params:
      asset_cfg:
        name: robot
        joint_names: null
        joint_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        fixed_tendon_names: null
        fixed_tendon_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        body_names: .*
        body_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        object_collection_names: null
        object_collection_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        preserve_order: false
      static_friction_range: !!python/tuple
      - 0.8
      - 0.8
      dynamic_friction_range: !!python/tuple
      - 0.6
      - 0.6
      restitution_range: !!python/tuple
      - 0.0
      - 0.0
      num_buckets: 64
    mode: startup
    interval_range_s: null
    is_global_time: false
    min_step_count_between_reset: 0
observation_space: 129
num_observations: null
state_space: 0
num_states: null
observation_noise_model: null
action_space: 10
num_actions: null
action_noise_model: null
rerender_on_reset: false
wait_for_textures: true
xr: null
min_episode_length_s: 5.0
randomize_episode_length: true
obs_stack_frames: 3
robot:
  class_type: isaaclab.assets.articulation.articulation:Articulation
  prim_path: /World/envs/env_.*/Robot
  spawn:
    func: isaaclab.sim.spawners.from_files.from_files:spawn_from_usd
    visible: true
    semantic_tags: null
    copy_from_source: true
    mass_props: null
    deformable_props: null
    rigid_props:
      rigid_body_enabled: null
      kinematic_enabled: null
      disable_gravity: false
      linear_damping: 0.0
      angular_damping: 0.0
      max_linear_velocity: 1000.0
      max_angular_velocity: 1000.0
      max_depenetration_velocity: 5.0
      max_contact_impulse: null
      enable_gyroscopic_forces: null
      retain_accelerations: false
      solver_position_iteration_count: null
      solver_velocity_iteration_count: null
      sleep_threshold: null
      stabilization_threshold: null
    collision_props: null
    activate_contact_sensors: true
    scale: null
    articulation_props:
      articulation_enabled: null
      enabled_self_collisions: true
      solver_position_iteration_count: 12
      solver_velocity_iteration_count: 2
      sleep_threshold: null
      stabilization_threshold: null
      fix_root_link: null
    fixed_tendons_props: null
    joint_drive_props: null
    visual_material_path: material
    visual_material: null
    usd_path: /workspace/simulation/source/tritonhumanoid/tritonhumanoid/assets/human_offset_corrected/human_offset_corrected.usd
    variants: null
  init_state:
    pos: !!python/tuple
    - 0.0
    - 0.0
    - 0.75
    rot: !!python/tuple
    - 0.7071067811865476
    - 0.0
    - 0.0
    - -0.7071067811865475
    lin_vel: !!python/tuple
    - 0.0
    - 0.0
    - 0.0
    ang_vel: !!python/tuple
    - 0.0
    - 0.0
    - 0.0
    joint_pos:
      left_hip1_joint: 0.3
      left_hip2_joint: 0.0
      left_thigh_joint: 0.0
      left_knee_joint: -0.8
      left_ankle_joint: 0.4
      right_hip1_joint: 0.3
      right_hip2_joint: 0.0
      right_thigh_joint: 0.0
      right_knee_joint: -0.8
      right_ankle_joint: 0.4
    joint_vel:
      .*: 0.0
  collision_group: 0
  debug_vis: false
  soft_joint_pos_limit_factor: 0.95
  actuators:
    legs:
      class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
      joint_names_expr:
      - left_hip1_joint
      - left_hip2_joint
      - left_thigh_joint
      - left_knee_joint
      - left_ankle_joint
      - right_hip1_joint
      - right_hip2_joint
      - right_thigh_joint
      - right_knee_joint
      - right_ankle_joint
      effort_limit: null
      velocity_limit: null
      effort_limit_sim: 120.0
      velocity_limit_sim: 20.0
      stiffness:
        .*hip.*: 300.0
        .*thigh.*: 300.0
        .*knee.*: 350.0
        .*ankle.*: 150.0
      damping:
        .*hip.*: 30.0
        .*thigh.*: 28.0
        .*knee.*: 22.0
        .*ankle.*: 16.0
      armature: 0.0
      friction: 0.05
