hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - env.motion_reference_dir=/cephfs/holosoma/data/lafan/retargeted/ch_robot_stance_flatfoot_locomotion_full_floor_norm_with_vel
    - env.motion_manifest_file=manifests/lafan_walk_16k_fast_manifest.txt
    - env.motion_reference_playback=false
    - env.motion_random_start=true
    - env.motion_min_length_s=1.0
    - env.motion_cache_on_gpu=true
    - +agent.params.config.full_experiment_name=lafan_walk_16k_fast
    - env.events=null
    - env.enable_adr=false
    - env.enable_contact_rewards=false
    - env.enable_contact_sensors=false
    - env.enable_reward_logging=false
    - env.push_force_range=[0.0,0.0]
    - env.reset_joint_pos_noise=0.0
    - env.reset_joint_vel_noise=0.0
    - env.robot.spawn.activate_contact_sensors=false
    - env.robot.spawn.articulation_props.enabled_self_collisions=false
    - env.robot.spawn.articulation_props.solver_position_iteration_count=4
    - env.robot.spawn.articulation_props.solver_velocity_iteration_count=0
    - env.enable_frame_transformer=false
    - agent.params.config.minibatch_size=98304
  job:
    name: hydra
    chdir: null
    override_dirname: +agent.params.config.full_experiment_name=lafan_walk_16k_fast,agent.params.config.minibatch_size=98304,env.enable_adr=false,env.enable_contact_rewards=false,env.enable_contact_sensors=false,env.enable_frame_transformer=false,env.enable_reward_logging=false,env.events=null,env.motion_cache_on_gpu=true,env.motion_manifest_file=manifests/lafan_walk_16k_fast_manifest.txt,env.motion_min_length_s=1.0,env.motion_random_start=true,env.motion_reference_dir=/cephfs/holosoma/data/lafan/retargeted/ch_robot_stance_flatfoot_locomotion_full_floor_norm_with_vel,env.motion_reference_playback=false,env.push_force_range=[0.0,0.0],env.reset_joint_pos_noise=0.0,env.reset_joint_vel_noise=0.0,env.robot.spawn.activate_contact_sensors=false,env.robot.spawn.articulation_props.enabled_self_collisions=false,env.robot.spawn.articulation_props.solver_position_iteration_count=4,env.robot.spawn.articulation_props.solver_velocity_iteration_count=0
    id: ???
    num: ???
    config_name: Isaac-Humanoid-Locomotion-Flat-Direct-v0
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /workspace/simulation
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: isaaclab_tasks.utils
      schema: pkg
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /workspace/simulation/outputs/2026-06-02/11-14-07
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
